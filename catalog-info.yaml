apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ansible
  description: "Ansible is a radically simple IT automation platform that makes your\
    \ applications and systems easier to deploy. Avoid writing scripts or custom code\
    \ to deploy and update your applications \u2014 automate in a language that approaches\
    \ plain English, using SSH, with no agents to install on remote systems. https://docs.ansible.com/ansible/"
  annotations:
    business-unit: EverHealth
    github.com/project-slug: updox/ansible
    product: UPD
spec:
  type: service
  lifecycle: production
  owner: EverHealth
  implementation:
    languages:
    - Python
    - PowerShell
    - Shell
    - C#
    - Jinja
    - Makefile
    - Tcl
    - Go
    - Roff
    - DIGITAL Command Language
    - Dockerfile
    - Batchfile
    - JavaScript
    - HTML
